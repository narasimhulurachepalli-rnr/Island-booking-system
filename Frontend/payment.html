<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Center - IslandGate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="section">
        <h2 class="section-title">Secure <span>Payment Portal</span></h2>

        <div class="grid-booking">
            <!-- Left Panel: Form -->
            <div class="booking-panel">
                <h3 style="font-family:var(--font-heading); margin-bottom:1.5rem; border-bottom:1px solid var(--border); padding-bottom:0.5rem;">Select Payment Method</h3>
                <form class="auth-form" id="payment-form">
                    <div class="form-group">
                        <label for="payment-method-select">Payment Method</label>
                        <select id="payment-method-select" class="form-control" required onchange="toggleCardInputs()">
                            <option value="">-- Select Payment Method --</option>
                            <option value="UPI">UPI (Google Pay / PhonePe / Paytm)</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Net Banking">Net Banking</option>
                            <option value="Wallet">Digital Wallet</option>
                        </select>
                    </div>

                    <!-- Dynamic card detail inputs -->
                    <div id="card-detail-section" style="display:none; flex-direction:column; gap:1.25rem;">
                        <div class="form-group">
                            <label for="pay-card-num">Card Number</label>
                            <input type="text" id="pay-card-num" class="form-control" placeholder="1111-2222-3333-4444" pattern="^[0-9- ]{15,19}$">
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                            <div class="form-group">
                                <label for="pay-card-expiry">Expiry Date</label>
                                <input type="text" id="pay-card-expiry" class="form-control" placeholder="MM/YY" pattern="^[0-9]{2}/[0-9]{2}$">
                            </div>
                            <div class="form-group">
                                <label for="pay-card-cvv">CVV</label>
                                <input type="password" id="pay-card-cvv" class="form-control" placeholder="***" pattern="^[0-9]{3}$">
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic UPI detail inputs -->
                    <div id="upi-detail-section" style="display:none;" class="form-group">
                        <label for="pay-upi-id">UPI ID / VPA</label>
                        <input type="text" id="pay-upi-id" class="form-control" placeholder="e.g. user@okaxis">
                    </div>

                    <div class="form-group">
                        <label for="payment-amount-display">Amount to Pay</label>
                        <input type="text" id="payment-amount-display" class="form-control" readonly style="background-color: var(--border); font-weight:700; color:var(--primary); font-size:1.15rem;">
                    </div>

                    <button type="submit" class="btn-auth-submit" style="margin-top: 1rem;" id="submit-pay-btn">Confirm Payment</button>
                </form>
            </div>

            <!-- Right Panel: Summary -->
            <div class="booking-summary-card" id="booking-details-panel">
                <h3>Reservation Summary</h3>
                <div style="text-align:center; padding:2rem; opacity:0.8;">
                    Loading reservation details...
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IslandGate Booking System. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        let targetBooking = null;
        let bookingId = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            bookingId = params.get('booking_id');

            if (!bookingId) {
                showAlert("Missing booking information. Redirecting to home...", "error");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);
                return;
            }

            await loadBookingDetails(bookingId);
        });

        async function loadBookingDetails(id) {
            try {
                const bookings = await apiFetch("/bookings/");
                targetBooking = bookings.find(b => b.booking_id === parseInt(id));

                if (!targetBooking) {
                    showAlert("Booking reservation not found", "error");
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);
                    return;
                }

                document.getElementById("payment-amount-display").value = `₹${targetBooking.total_amount.toLocaleString()}`;
                renderRightPanel();
            } catch (err) {
                console.error(err);
                showAlert("Failed to load booking details from server", "error");
            }
        }

        function renderRightPanel() {
            const panel = document.getElementById("booking-details-panel");
            panel.innerHTML = `
                <h3>Reservation Summary</h3>
                
                <div class="summary-row">
                    <span style="opacity:0.75;">Booking ID</span>
                    <span style="font-weight:600;">#${targetBooking.booking_id}</span>
                </div>
                <div class="summary-row">
                    <span style="opacity:0.75;">Traveler Name</span>
                    <span style="font-weight:600;">${targetBooking.customer_name}</span>
                </div>
                <div class="summary-row">
                    <span style="opacity:0.75;">Island Visited</span>
                    <span style="font-weight:600;">${targetBooking.island_name}</span>
                </div>
                <div class="summary-row">
                    <span style="opacity:0.75;">Package Deal</span>
                    <span style="font-weight:600;">${targetBooking.package_name}</span>
                </div>
                <div class="summary-row">
                    <span style="opacity:0.75;">Journey Date</span>
                    <span style="font-weight:600;">${targetBooking.travel_date}</span>
                </div>
                <div class="summary-row">
                    <span style="opacity:0.75;">Guest Count</span>
                    <span style="font-weight:600;">${targetBooking.number_of_people} Person(s)</span>
                </div>
                
                <div class="summary-row total">
                    <span>Amount Charged</span>
                    <span>₹${targetBooking.total_amount.toLocaleString()}</span>
                </div>

                <div style="background-color:rgba(255,255,255,0.06); padding:1rem; border-radius:var(--radius-md); font-size:0.85rem; line-height:1.5; color:#cbd5e1; margin-top:0.5rem; text-align:center;">
                    🔒 256-Bit SSL Encrypted Transaction Gateway
                </div>
            `;
        }

        function toggleCardInputs() {
            const method = document.getElementById("payment-method-select").value;
            const cardSec = document.getElementById("card-detail-section");
            const upiSec = document.getElementById("upi-detail-section");

            cardSec.style.display = "none";
            upiSec.style.display = "none";

            document.getElementById("pay-card-num").required = false;
            document.getElementById("pay-card-expiry").required = false;
            document.getElementById("pay-card-cvv").required = false;
            document.getElementById("pay-upi-id").required = false;

            if (method === "Credit Card" || method === "Debit Card") {
                cardSec.style.display = "flex";
                document.getElementById("pay-card-num").required = true;
                document.getElementById("pay-card-expiry").required = true;
                document.getElementById("pay-card-cvv").required = true;
            } else if (method === "UPI") {
                upiSec.style.display = "block";
                document.getElementById("pay-upi-id").required = true;
            }
        }

        document.getElementById("payment-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!targetBooking) return;

            const method = document.getElementById("payment-method-select").value;
            const transactionId = "TXN" + Date.now() + Math.floor(Math.random() * 100);
            const today = new Date().toISOString().split('T')[0];

            try {
                document.getElementById("submit-pay-btn").innerText = "Processing Transaction...";
                document.getElementById("submit-pay-btn").disabled = true;

                // 1. Post Payment record to /payments/add/
                const paymentPayload = {
                    booking_id: targetBooking.booking_id,
                    customer_name: targetBooking.customer_name,
                    amount: targetBooking.total_amount,
                    payment_method: method,
                    payment_status: "Success",
                    transaction_id: transactionId,
                    payment_date: today
                };

                await apiFetch("/payments/add/", {
                    method: "POST",
                    body: JSON.stringify(paymentPayload)
                });

                // 2. Update Booking Status to "Confirmed"
                const bookingPayload = {
                    customer_name: targetBooking.customer_name,
                    island_name: targetBooking.island_name,
                    package_name: targetBooking.package_name,
                    travel_date: targetBooking.travel_date,
                    number_of_people: targetBooking.number_of_people,
                    total_amount: targetBooking.total_amount,
                    booking_status: "Confirmed"
                };

                await apiFetch(`/bookings/update/${targetBooking.booking_id}/`, {
                    method: "PUT",
                    body: JSON.stringify(bookingPayload)
                });

                showAlert(`Payment Success! Transaction ID: ${transactionId}`, "success");
                
                setTimeout(() => {
                    window.location.href = "customer_dashboard.html?pay_success=true";
                }, 1500);

            } catch (err) {
                showAlert("Transaction failed. Please try again.", "error");
                console.error(err);
                document.getElementById("submit-pay-btn").innerText = "Confirm Payment";
                document.getElementById("submit-pay-btn").disabled = false;
            }
        });
    </script>
</body>
</html>
